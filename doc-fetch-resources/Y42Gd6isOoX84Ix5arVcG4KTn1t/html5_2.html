<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="抖音赛马加流量池与小红书CES评分加搜索驱动的双平台流量机制对比图">
<title>双平台流量机制对比</title>
</head>
<body style="margin:0;padding:0;background:#fff;">
<div style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;max-width:820px;margin:0 auto;padding:12px 4px;box-sizing:border-box;">
<p style="font-size:16px;font-weight:600;color:#1A2B4A;margin:0 0 4px;">抖音「赛马+流量池」 vs 小红书「CES+搜索」：两套完全不同的流量逻辑</p>
<p style="font-size:13px;color:#646A73;margin:0 0 10px;">同一份内容必须按平台逻辑分开制作：抖音拼前3秒留存与完播、爆款生命周期约7天；小红书拼收藏/评论/关注、靠搜索持续数月带量。</p>
<svg viewBox="0 0 820 470" width="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- 左侧：抖音 -->
  <rect x="16" y="30" width="380" height="30" rx="6" fill="#1A2B4A"/>
  <text x="206" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">抖音：赛马机制 + 分层流量池</text>

  <rect x="36" y="78" width="340" height="52" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="56" y="100" font-size="14" font-weight="600" fill="#1A2B4A">① 冷启动：约 500–1000 曝光</text>
  <text x="56" y="120" font-size="13" fill="#646A73">初始互动、停留、完播反馈</text>
  <text x="206" y="145" text-anchor="middle" font-size="13" fill="#646A73">▼ 达标晋级，否则停推</text>

  <rect x="36" y="158" width="340" height="64" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="56" y="180" font-size="14" font-weight="600" fill="#1A2B4A">② 赛马池：同标签实时 PK</text>
  <text x="56" y="200" font-size="13" fill="#1F2329">前3秒留存 ~40% · 完播率 ~40%</text>
  <text x="56" y="216" font-size="13" fill="#1F2329">15秒互动密度 ~20%</text>
  <text x="206" y="237" text-anchor="middle" font-size="13" fill="#646A73">▼ 数据胜出则加量</text>

  <rect x="36" y="250" width="340" height="52" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="56" y="272" font-size="14" font-weight="600" fill="#1A2B4A">③ 长尾热推：约 7 天周期</text>
  <text x="56" y="292" font-size="13" fill="#646A73">用户总停留时长 · 复访 · 互动深度</text>
  <text x="206" y="317" text-anchor="middle" font-size="13" fill="#646A73">▼</text>

  <rect x="96" y="328" width="220" height="40" rx="20" fill="#DDE0E4" stroke="#758092"/>
  <text x="206" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#1A2B4A">爆款放量 / 停止推流</text>

  <rect x="36" y="390" width="340" height="58" rx="8" fill="#F2F5F9" stroke="#DEE3E8"/>
  <text x="56" y="412" font-size="13" font-weight="600" fill="#1A2B4A">关键变量</text>
  <text x="56" y="432" font-size="13" fill="#1F2329">铁粉 = 首批审核员 · SABC 账号分级（等级比粉丝量重要）</text>

  <!-- 右侧：小红书 -->
  <rect x="424" y="30" width="380" height="30" rx="6" fill="#1A2B4A"/>
  <text x="614" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">小红书：CES 评分 + 搜索驱动</text>

  <rect x="444" y="78" width="340" height="52" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="464" y="100" font-size="14" font-weight="600" fill="#1A2B4A">① 发布 → 审核 → 收录打标签</text>
  <text x="464" y="120" font-size="13" fill="#646A73">标签分类后进入第一轮小流量测试</text>
  <text x="614" y="145" text-anchor="middle" font-size="13" fill="#646A73">▼ CES 达标才阶梯放大</text>

  <rect x="444" y="158" width="340" height="64" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="464" y="180" font-size="14" font-weight="600" fill="#1A2B4A">② 小流量池测试点击与互动</text>
  <text x="464" y="200" font-size="13" fill="#1F2329">CES = 点赞1 + 收藏1 + 评论4</text>
  <text x="464" y="216" font-size="13" fill="#1F2329">+ 转发4 + 关注8</text>
  <text x="614" y="237" text-anchor="middle" font-size="13" fill="#646A73">▼ 高分进入更大流量池</text>

  <rect x="444" y="250" width="340" height="52" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="464" y="272" font-size="14" font-weight="600" fill="#1A2B4A">③ 搜索长尾：60%+ 流量来自搜索</text>
  <text x="464" y="292" font-size="13" fill="#646A73">优质笔记推荐期可延长至约 90 天</text>
  <text x="614" y="317" text-anchor="middle" font-size="13" fill="#646A73">▼</text>

  <rect x="504" y="328" width="220" height="40" rx="20" fill="#DDE0E4" stroke="#758092"/>
  <text x="614" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#1A2B4A">持续被搜索激活（长尾复利）</text>

  <rect x="444" y="390" width="340" height="58" rx="8" fill="#F2F5F9" stroke="#DEE3E8"/>
  <text x="464" y="412" font-size="13" font-weight="600" fill="#1A2B4A">关键变量</text>
  <text x="464" y="432" font-size="13" fill="#1F2329">收藏/评论/关注权重远高于点赞 · 50%+ 流量给千粉以下账号</text>
</svg>
<p style="font-size:12px;color:#646A73;margin:8px 0 0;">依据：【已查证】woshipm 6328838（抖音三层模型/前3秒权重）、woshipm share/6147163（小红书CES/搜索流量）；权重数字为行业经验值、非官方公布，实操以后台最新规则为准。</p>
</div>
</body>
</html>
