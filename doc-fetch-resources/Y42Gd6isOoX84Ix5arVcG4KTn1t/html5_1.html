<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="双平台运营核心链路图：定位、选题、制作、发布、复盘、放大六个环节及两平台差异">
<title>双平台运营核心链路</title>
</head>
<body style="margin:0;padding:0;background:#fff;">
<div style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;max-width:820px;margin:0 auto;padding:12px 4px;box-sizing:border-box;">
<p style="font-size:16px;font-weight:600;color:#1A2B4A;margin:0 0 4px;">双平台运营核心链路：定位 → 选题 → 制作 → 发布 → 复盘 → 放大</p>
<p style="font-size:13px;color:#646A73;margin:0 0 10px;">六个环节两平台通用，但每个环节的做法必须按平台机制分化（蓝=抖音，红=小红书差异点）。</p>
<svg viewBox="0 0 820 430" width="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- 第一行：定位 选题 制作 -->
  <rect x="16" y="30" width="250" height="120" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="141" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B4A">① 定位</text>
  <text x="36" y="78" font-size="13" fill="#1F2329">一句话人设：我是【身份】+帮【人群】</text>
  <text x="36" y="96" font-size="13" fill="#1F2329">+解决【问题】+差异化</text>
  <text x="36" y="120" font-size="12" fill="#646A73">抖音：强表现力人设，昵称含领域词</text>
  <text x="36" y="138" font-size="12" fill="#646A73">小红书：干货型人设，主页四件套+关键词</text>

  <rect x="285" y="30" width="250" height="120" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="410" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B4A">② 选题</text>
  <text x="305" y="78" font-size="13" fill="#1F2329">7:2:1 = 干货70% + 痛点20%</text>
  <text x="305" y="96" font-size="13" fill="#1F2329">+ 热点10%（热点×赛道交叉才蹭）</text>
  <text x="305" y="120" font-size="12" fill="#646A73">素材库：第3章抖音Top20 / 第4章小红书Top20</text>
  <text x="305" y="138" font-size="12" fill="#646A73">评论区反复被问的问题 = 下一篇选题</text>

  <rect x="554" y="30" width="250" height="120" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="679" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B4A">③ 制作</text>
  <text x="574" y="78" font-size="13" fill="#1F2329">3秒钩子前置最冲突一帧</text>
  <text x="574" y="96" font-size="13" fill="#1F2329">标题双引擎：情绪断言+利益实用</text>
  <text x="574" y="120" font-size="12" fill="#646A73">抖音：BGM按题材分轨、时长按完播分化</text>
  <text x="574" y="138" font-size="12" fill="#646A73">小红书：标题=关键词货架、封面=点击率闸门</text>

  <!-- 下行箭头 -->
  <text x="141" y="170" text-anchor="middle" font-size="14" fill="#646A73">▼</text>
  <text x="410" y="170" text-anchor="middle" font-size="14" fill="#646A73">▼</text>
  <text x="679" y="170" text-anchor="middle" font-size="14" fill="#646A73">▼</text>

  <!-- 第二行：发布 复盘 放大 -->
  <rect x="16" y="190" width="250" height="120" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="141" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B4A">④ 发布</text>
  <text x="36" y="238" font-size="13" fill="#1F2329">目标用户活跃前30分钟发</text>
  <text x="36" y="256" font-size="13" fill="#1F2329">抖音：日更或一周4–5条</text>
  <text x="36" y="274" font-size="13" fill="#1F2329">小红书：一周3–5篇，质量优先</text>
  <text x="36" y="296" font-size="12" fill="#646A73">发布后30–60分钟内回复评论</text>

  <rect x="285" y="190" width="250" height="120" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="410" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B4A">⑤ 复盘</text>
  <text x="305" y="238" font-size="13" fill="#1F2329">24h / 72h / 7天各看一次</text>
  <text x="305" y="256" font-size="13" fill="#1F2329">抖音：前3秒留存 ≥40%、完播率</text>
  <text x="305" y="274" font-size="13" fill="#1F2329">小红书：封面点击率、收藏率、评论率</text>
  <text x="305" y="296" font-size="12" fill="#646A73">持续 &lt;500 播放 → 查限流/标签/违规</text>

  <rect x="554" y="190" width="250" height="120" rx="8" fill="#F2F5F9" stroke="#BABFC9"/>
  <text x="679" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B4A">⑥ 放大</text>
  <text x="574" y="238" font-size="13" fill="#1F2329">爆款立刻做系列续集/二创</text>
  <text x="574" y="256" font-size="13" fill="#1F2329">抖音：破5000播放投30–100元 Dou+</text>
  <text x="574" y="274" font-size="13" fill="#1F2329">小红书：自然数据好的笔记投75元薯条</text>
  <text x="574" y="296" font-size="12" fill="#646A73">1000粉后申请蒲公英/买手橱窗</text>

  <!-- 底部总结 -->
  <rect x="16" y="340" width="788" height="66" rx="8" fill="#F2F5F9" stroke="#758092"/>
  <text x="36" y="364" font-size="14" font-weight="600" fill="#1A2B4A">30天目标：抖音 500–2000 粉、小红书 500–1000 粉，跑出 1 条 &gt;5000 播放/阅读的小爆款</text>
  <text x="36" y="390" font-size="13" fill="#646A73">完整清单见第2章「30天起号 Checklist」；每个环节的具体公式与方法见第2章各小节。</text>
</svg>
</div>
</body>
</html>
